name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Run tests weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level to run'
        required: false
        default: 'standard'
        type: choice
        options:
          - 'quick'
          - 'standard'
          - 'comprehensive'

env:
  TF_VERSION: "1.6.0"
  GO_VERSION: "1.21"
  TERRATEST_TIMEOUT: "30m"
  REGISTRY_VALIDATION: "true"

jobs:
  # Quality Gates - Fast feedback for basic issues
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    outputs:
      should_run_full_tests: ${{ steps.changes.outputs.should_run_full_tests }}
      test_level: ${{ steps.test-level.outputs.level }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine test level
        id: test-level
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "level=${{ github.event.inputs.test_level }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "level=comprehensive" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "level=standard" >> $GITHUB_OUTPUT
          else
            echo "level=quick" >> $GITHUB_OUTPUT
          fi

      - name: Check for significant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Check if changes include Terraform files or critical paths
            if git diff --name-only origin/main...HEAD | grep -E '\.(tf|tfvars)$|Makefile|\.github/workflows/'; then
              echo "should_run_full_tests=true" >> $GITHUB_OUTPUT
            else
              echo "should_run_full_tests=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_run_full_tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: make check-format

      - name: Basic Terraform Validation
        run: |
          # Quick validation of main module files
          terraform fmt -check -recursive
          find . -name "main.tf" -exec dirname {} \; | head -5 | while read dir; do
            echo "Validating $dir"
            cd "$dir" && terraform init -backend=false && terraform validate && cd - > /dev/null
          done

  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest
    needs: quality-gates
    if: needs.quality-gates.outputs.should_run_full_tests == 'true'
    strategy:
      matrix:
        terraform-version: ["1.5.0", "1.6.0"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform-version }}

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ matrix.terraform-version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ matrix.terraform-version }}-

      - name: Terraform Format Check
        run: make check-format

      - name: Terraform Validation
        run: make validate

      - name: Terraform Plan Examples
        run: make plan

      - name: Registry Validation
        if: env.REGISTRY_VALIDATION == 'true'
        run: make validate-registry

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: terraform-validation
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('test/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download Go dependencies
      working-directory: test
      run: go mod download

    - name: Run Plan Validation Tests
      working-directory: test
      run: go test -v -timeout ${{ env.TERRATEST_TIMEOUT }} -run TestTerraformPlan

    - name: Run Module Standards Tests
      working-directory: test
      run: go test -v -timeout 10m -run TestModuleStandards

    - name: Run Terraform Validation Tests
      working-directory: test
      run: go test -v -timeout 10m -run TestTerraformValidation

    - name: Run Format Tests
      working-directory: test
      run: go test -v -timeout 5m -run TestTerraformFormat

    - name: Run Compliance Tests
      working-directory: test
      run: go test -v -timeout 20m -run TestCompliance

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: terraform-validation
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run TFSec security scanner
      uses: aquasecurity/tfsec-action@v1.0.3
      with:
        soft_fail: true

  lint:
    name: Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Cache TFLint plugins
      uses: actions/cache@v3
      with:
        path: ~/.tflint.d/plugins
        key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest

    - name: Initialize TFLint
      run: tflint --init

    - name: Run TFLint
      run: make lint

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup terraform-docs
      uses: terraform-docs/gh-actions@v1.0.0
      with:
        working-dir: .
        output-file: README.md
        output-method: inject
        git-push: false
        fail-on-diff: true

  test-matrix:
    name: Test Matrix
    runs-on: ubuntu-latest
    needs: [go-tests, security-scan, lint]
    strategy:
      matrix:
        test-type: [plan, standards, validation, format, compliance, security, cost, governance]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('test/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Run Test Type - ${{ matrix.test-type }}
      run: make test-${{ matrix.test-type }}

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: test-matrix
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    - name: Run Full Test Suite
      working-directory: test
      run: go test -v -timeout 45m ./...

    - name: Generate Test Report
      if: always()
      working-directory: test
      run: |
        go test -v -timeout 45m -json ./... > test-results.json
        echo "Test results saved to test-results.json"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: test/test-results.json

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [terraform-validation, go-tests, security-scan, lint, documentation, integration-test]
    if: always()
    
    steps:
    - name: Notify Success
      if: ${{ needs.terraform-validation.result == 'success' && needs.go-tests.result == 'success' && needs.security-scan.result == 'success' && needs.lint.result == 'success' && needs.documentation.result == 'success' }}
      run: echo "✅ All tests passed successfully!"

    - name: Notify Failure
      if: ${{ needs.terraform-validation.result == 'failure' || needs.go-tests.result == 'failure' || needs.security-scan.result == 'failure' || needs.lint.result == 'failure' || needs.documentation.result == 'failure' }}
      run: |
        echo "❌ Some tests failed:"
        echo "Terraform Validation: ${{ needs.terraform-validation.result }}"
        echo "Go Tests: ${{ needs.go-tests.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "Lint: ${{ needs.lint.result }}"
        echo "Documentation: ${{ needs.documentation.result }}"
        exit 1